# Local smoke tests only. No company infrastructure is used.
server.address=127.0.0.1
static.eureka=127.0.0.1
static.eurekaport=8081
static.redis=127.0.0.1
static.rabbitmq=127.0.0.1
static.db=127.0.0.1
spring.redis.host=127.0.0.1
spring.redis.port=16379
spring.redis.database=0
spring.redis.password=
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=15672
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
rabbit.sendMessage.enable=false
rabbit.sendMessage.filterGet=false
eureka.client.service-url.defaultZone=http://127.0.0.1:8081/eureka/
eureka.instance.hostname=127.0.0.1
eureka.instance.ip-address=127.0.0.1
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
spring.boot.admin.client.enabled=false
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
management.endpoints.enabled-by-default=true
management.endpoints.web.exposure.exclude=
management.endpoints.web.exposure.include=health,info
management.endpoint.health.enabled=true
management.endpoint.health.show-details=never
management.health.rabbit.enabled=false
swagger.enable=false
ribbon.ServerListRefreshInterval=5000
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=5000
gmProject.Sms.WebService.url=http://127.0.0.1:9/disabled
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
