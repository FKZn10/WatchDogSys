server:
  address: 127.0.0.1
  port: 8081
spring:
  application:
    name: eureka-server
  profiles:
    active: local
eureka:
  instance:
    hostname: 127.0.0.1
    prefer-ip-address: true
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://127.0.0.1:8081/eureka/
  server:
    enable-self-preservation: false
  dashboard:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
logging:
  level:
    com.netflix.discovery: WARN
    com.netflix.eureka: WARN
